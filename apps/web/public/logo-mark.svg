<svg
  aria-labelledby="personalos-mark-title"
  fill="none"
  role="img"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="personalos-mark-title">PersonalOS</title>
  <defs>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="pos-mark-bg"
      x1="8"
      x2="56"
      y1="6"
      y2="58"
    >
      <stop stop-color="#0F766E" />
      <stop offset="1" stop-color="#134E4A" />
    </linearGradient>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="pos-mark-ring"
      x1="18"
      x2="48"
      y1="14"
      y2="50"
    >
      <stop stop-color="#99F6E4" />
      <stop offset="1" stop-color="#5EEAD4" />
    </linearGradient>
  </defs>
  <!-- OS tile -->
  <rect fill="url(#pos-mark-bg)" height="64" rx="16" width="64" />
  <!-- soft inner panel -->
  <rect
    fill="#042F2E"
    fill-opacity="0.35"
    height="48"
    rx="12"
    width="48"
    x="8"
    y="8"
  />
  <!-- orbit rings -->
  <ellipse
    cx="32"
    cy="32"
    rx="18"
    ry="11"
    stroke="url(#pos-mark-ring)"
    stroke-opacity="0.55"
    stroke-width="2"
    transform="rotate(-28 32 32)"
  />
  <ellipse
    cx="32"
    cy="32"
    rx="18"
    ry="11"
    stroke="#CCFBF1"
    stroke-opacity="0.35"
    stroke-width="1.5"
    transform="rotate(42 32 32)"
  />
  <!-- personal core -->
  <circle cx="32" cy="32" fill="#F0FDFA" r="7.5" />
  <circle cx="32" cy="32" fill="#14B8A6" r="3.25" />
  <!-- accent satellites -->
  <circle cx="46.5" cy="24" fill="#5EEAD4" r="2.25" />
  <circle cx="21" cy="43.5" fill="#99F6E4" fill-opacity="0.9" r="1.75" />
</svg>
