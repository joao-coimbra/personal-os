name: CI Web

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-web-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Stub CI env
        run: bash scripts/ci-stub-env.sh

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck & build (web + deps)
        run: bun x turbo run check-types build -F web...
